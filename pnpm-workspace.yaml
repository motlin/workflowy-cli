packages:
  - "packages/*"
onlyBuiltDependencies:
  - esbuild
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vitest: 5.0.1
  vite-plus: 1.1.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # Older postcss reads arbitrary .map files from an attacker-controlled sourceMappingURL (GHSA-6g55-p6wh-862q).
  postcss: ">=8.5.23"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  fallow: true
  node-llama-cpp: false
  protobufjs: false
  sharp: true
  tree-sitter-go: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-typescript: false
