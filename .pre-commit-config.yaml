repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
        # TypeScript config files allow comments.
        exclude: "tsconfig.*\\.json"
      - id: check-toml
      - id: check-xml
      - id: end-of-file-fixer
        exclude: "pnpm-lock\\.yaml|^\\.idea/"
      - id: trailing-whitespace
        exclude: "pnpm-lock\\.yaml|^\\.idea/"
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["--strict"]
        types: [yaml]
        exclude: "^(node_modules/|dist/|packages/[^/]+/dist/|storybook-static/|backups/|\\.llm/|\\.claude/|pnpm-lock\\.yaml)"

  - repo: local
    hooks:
      - id: just-fmt
        name: just --fmt
        entry: sh -c 'for file do just --fmt --justfile "$file" || exit; done' --
        language: system
        files: '(?i)(^|/)\.?justfile$|\.just$'
        types: [file]
      - id: oxfmt
        name: vp fmt
        entry: vp fmt --no-error-on-unmatched-pattern
        language: system
      - id: check-staged-pii
        name: check staged PII
        entry: scripts/check-staged-pii.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: vp exec markdownlint-cli2
        language: system
        types: [markdown]
        # Keep in sync with ignores in .markdownlint-cli2.jsonc.
        # CLAUDE.md contains the vp-generated Vite+ block, which markdownlint rules would flag.
        exclude: "^(node_modules/|\\.llm/|\\.claude/|dist/|packages/[^/]+/dist/|backups/|AGENTS\\.md$|CLAUDE\\.md$|CLAUDE\\.local\\.md$)"
      - id: fallow
        name: fallow
        entry: vp exec fallow fix --base HEAD --yes --no-create-config
        language: system
        pass_filenames: false
        types: [file]
